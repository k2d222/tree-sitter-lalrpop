[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools>=62.4.0", "wheel" ]

[project]
authors = [ { email = "mathis.brossier@gmail.com", name = "Mathis Brossier" } ]
classifiers = [
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Compilers",
  "Topic :: Text Processing :: Linguistic",
  "Typing :: Typed",
]
description = "tree-sitter grammar for LALRPOP"
keywords = [ "incremental", "parsing", "tree-sitter", "lalrpop" ]
license.text = "MIT"
name = "tree-sitter-lalrpop"
readme = "README.md"
requires-python = ">=3.10"
version = "0.1.0"

[project.urls]
Funding = ""
Homepage = "https://github.com/k2d222/tree-sitter-lalrpop"

[project.optional-dependencies]
core = [ "tree-sitter~=0.24" ]

[tool.cibuildwheel]
build = "cp310-*"
build-frontend = "build"
